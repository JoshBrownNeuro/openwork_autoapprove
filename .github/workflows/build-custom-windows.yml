name: Build Custom Windows x64 Installer

on:
  push:
    branches:
      - build/windows-x64-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test local slash-command transport
        run: pnpm --filter @openwork/app exec bun test tests/opencode-session-native.test.ts

      - name: Typecheck app
        run: pnpm --filter @openwork/app typecheck

      - name: Build Electron desktop
        env:
          OPENWORK_DESKTOP_SENTRY_DSN: ""
          OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: "0"
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --x64 --publish never

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          $output = "apps/desktop/dist-electron"
          $installers = @(Get-ChildItem -LiteralPath $output -Filter "*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No Windows installer was produced in $output"
          }
          $lines = foreach ($installer in $installers) {
            $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($installer.Name)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $output "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: openwork-autoapprove-windows-x64-installer
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/*.yml
            apps/desktop/dist-electron/SHA256SUMS.txt
